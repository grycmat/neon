name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode FOSS Release Keystore
        if: env.FOSS_KEYSTORE_BASE64 != ''
        env:
          FOSS_KEYSTORE_BASE64: ${{ secrets.FOSS_KEYSTORE_BASE64 }}
        run: |
          echo "$FOSS_KEYSTORE_BASE64" | base64 -d > neon-foss-release.jks

      - name: Decode GMS Release Keystore
        if: env.GMS_KEYSTORE_BASE64 != ''
        env:
          GMS_KEYSTORE_BASE64: ${{ secrets.GMS_KEYSTORE_BASE64 }}
        run: |
          echo "$GMS_KEYSTORE_BASE64" | base64 -d > neon-gms-release.jks

      - name: Build Release APKs
        env:
          FOSS_KEYSTORE_FILE: ../neon-foss-release.jks
          FOSS_KEYSTORE_PASSWORD: ${{ secrets.FOSS_KEYSTORE_PASSWORD }}
          FOSS_KEY_ALIAS: ${{ secrets.FOSS_KEY_ALIAS }}
          FOSS_KEY_PASSWORD: ${{ secrets.FOSS_KEY_PASSWORD }}
          GMS_KEYSTORE_FILE: ../neon-gms-release.jks
          GMS_KEYSTORE_PASSWORD: ${{ secrets.GMS_KEYSTORE_PASSWORD }}
          GMS_KEY_ALIAS: ${{ secrets.GMS_KEY_ALIAS }}
          GMS_KEY_PASSWORD: ${{ secrets.GMS_KEY_PASSWORD }}
          RELAY_BASE_URL: ${{ secrets.RELAY_BASE_URL }}
        run: ./gradlew :app:assembleFossRelease :app:assembleGmsRelease

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            app/build/outputs/apk/foss/release/app-foss-release.apk
            app/build/outputs/apk/gms/release/app-gms-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
